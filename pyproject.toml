[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhole"
version = "0.1.0"
description = "Black Hole - a large language model trained from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ggboykxz" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "accelerate>=0.30",
    "numpy",
    "safetensors",
    "tqdm",
    "einops",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
